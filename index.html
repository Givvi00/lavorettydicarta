    <title>Lavoretty di Carta</title>
    <script>
      try {
        var t = localStorage.getItem('lc-theme');
        if (t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
